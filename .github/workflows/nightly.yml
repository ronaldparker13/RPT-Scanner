name: nightly scan
on:
  schedule:
    - cron: "40 21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python run.py
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          PAGE_URL: https://ronaldparker13.github.io/RPT-Scanner/
      - name: commit the page
        run: |
          git config user.name "rpt-scanner-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git commit -m "scan $(date -u +%F)" || echo "nothing to commit"
          git push
